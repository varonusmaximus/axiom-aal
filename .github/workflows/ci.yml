name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint, format & types (Ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff and mypy
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "ruff==0.14.14" "mypy>=1.20.0"
      - name: Ruff lint
        run: ruff check . --config pyproject.toml
      - name: Ruff format check
        run: ruff format --check . --config pyproject.toml
      - name: Mypy
        run: mypy src/aal/ --config-file pyproject.toml

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ --cov=aal --cov-report=xml --cov-report=term
      - name: Coverage threshold check
        run: coverage report --fail-under=80

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and security tools
        run: |
          python -m pip install --upgrade pip
          pip install "bandit==1.8.6" pip-audit
          pip install -e ".[dev]"
      - name: Run Bandit
        run: bandit -c pyproject.toml -r src/aal/ -ll
      - name: Run pip-audit
        run: pip-audit
